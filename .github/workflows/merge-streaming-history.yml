# Merge Streaming History – runs on push to data/spotify-history and workflow_dispatch
# Merges raw Spotify export files, rebuilds the SQLite database, and commits it
name: Merge Streaming History

on:
  push:
    paths:
      - 'data/spotify-history/**'
  pull_request:
    paths:
      - 'data/spotify-history/**'
  workflow_dispatch: # Allow manual triggers

# When the UI uploads history in chunks, each chunk creates a commit and triggers this workflow.
# Only run the latest; cancel any in-progress run so we merge once after all uploads.
concurrency:
  group: merge-streaming-history-${{ github.ref }}
  cancel-in-progress: true

jobs:
  merge-history:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check for spotify-history files
        id: check-files
        run: |
          if [ -d "data/spotify-history" ] && [ "$(ls -A data/spotify-history/*.json 2>/dev/null)" ]; then
            echo "files_exist=true" >> $GITHUB_OUTPUT
            echo "Found Spotify history files"
            ls -la data/spotify-history/
          else
            echo "files_exist=false" >> $GITHUB_OUTPUT
            echo "No Spotify history files found"
          fi

      - name: Merge streaming history into JSON
        if: steps.check-files.outputs.files_exist == 'true'
        run: npm run merge-streaming-history

      - name: Rebuild SQLite database from merged history
        if: steps.check-files.outputs.files_exist == 'true'
        run: |
          # Remove stale DB so import runs fresh
          rm -f data/library.db data/library.db-wal data/library.db-shm
          npm run db:import

      - name: Enrich database from cleaned files (images, genres)
        if: steps.check-files.outputs.files_exist == 'true'
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: |
          npm run generate-cleaned-files
          npm run add-podcast-data
          npm run db:enrich

      - name: Pull latest changes
        if: steps.check-files.outputs.files_exist == 'true' && github.event_name == 'push'
        run: |
          git fetch origin master
          git pull --rebase origin master || git pull --no-edit origin master || echo "No remote changes to pull"

      - name: Commit updated database and data files
        if: steps.check-files.outputs.files_exist == 'true' && github.event_name == 'push'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -f data/library.db data/merged-streaming-history/ data/cleaned-data/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Rebuild database from new streaming history [skip ci]"
            git push https://x-access-token:${{ secrets.PERSONAL_ACCESS_TOKEN }}@github.com/${{ github.repository }}.git master
          fi
